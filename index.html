<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
    <header>
      <!-- Para filtros y navegacion -->
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <div class="cuadro">
        <form id="agregarComida">
          <div class="con">
            <label for="nombre">Nombre de la comida</label>
            <input type="text" placeholder="Nombre de la comida" name="nombre" required>
          </div>
  
          <div class="con">
            <label for="Categoría">Categoría</label>
            <input type="text" placeholder="Categoría" name="Categoría" required>
          </div>
  
          <div class="con">
            <label for="provincia">provincia</label>
            <input type="text" placeholder="Provincia" name='provincia' required>
          </div>
          <div class="con">
            <label for="ingredientes">Ingredientes</label>
            <input type="text" placeholder="ingredientes" name="ingredientes" required>
          </div>
          <div class="con">
            <button type="submit" class="submit">Agregar Comida</button>
          </div>
        </form>
      </div>
    </section>

    <script type="module" src="./main.js" defer></script>
</body>
</html>
